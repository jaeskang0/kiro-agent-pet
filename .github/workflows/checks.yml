name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify Kiro IDE bridge
        working-directory: extensions/kiro-agent-pet-bridge
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run package
      - name: Build C# application
        run: dotnet build KiroPet.slnx -c Release
      - name: Verify compatibility and native sessions
        run: dotnet run --project tests/KiroPet.Checks -c Release --no-build
      - name: Publish Windows desktop
        run: dotnet publish src/KiroPet.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish/desktop
      - name: Publish Windows commands
        run: dotnet publish src/KiroPet.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish/cli
      - name: Package portable Windows build
        run: dotnet run --project tools/KiroPet.Package -c Release --no-build -- artifacts/publish artifacts/kiro-agent-pet-0.4.3-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kiro-agent-pet-windows
          path: artifacts/kiro-agent-pet-0.4.3-windows.zip*
